name: Android internal checks
on:
  push:
    branches: [main, fix/internal-receptionist-catalog-history]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install required Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate disposable debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Internal CI"
          fi
      - name: Build and test without production Firebase
        env:
          CALL_TEST: ${{ github.head_ref == 'fix/owner-call-sync' || github.ref_name == 'fix/owner-call-sync' }}
          OWNER_TEST: ${{ github.head_ref == 'fix/kai-owner-lead-client' || github.ref_name == 'fix/kai-owner-lead-client' }}
        run: |
          package=com.aistudio.oceansurfer.kxmvqp
          if [ "$OWNER_TEST" = "true" ]; then package="$package.ownertest"; fi
          if [ "$CALL_TEST" = "true" ]; then package="$package.calltest"; fi
          echo '{"project_info":{"project_number":"1234567890","project_id":"demo-receptionist-ci"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0123456789abcdef","android_client_info":{"package_name":"'"$package"'"}},"api_key":[{"current_key":"offline-ci-placeholder"}]}],"configuration_version":"1"}' > app/google-services.json
          gradle --stacktrace -PkaiCallTest="$CALL_TEST" -PkaiOwnerTest="$OWNER_TEST" :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
