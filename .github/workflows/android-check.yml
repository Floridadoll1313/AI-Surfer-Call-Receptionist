name: Android internal checks
on:
  push:
    branches: [main, fix/internal-receptionist-catalog-history]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-check.yml'
  workflow_dispatch:
    inputs:
      firebase_phone_build:
        description: Build a Firebase-connected APK for handset testing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install required Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate disposable debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Internal CI"
          fi
      - name: Prepare offline Firebase fixture
        if: ${{ !inputs.firebase_phone_build }}
        run: |
          # Match the Firebase fixture to the Android application ID used by Gradle.
          application_id=$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([A-Za-z0-9_.]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)
          if [[ ! "$application_id" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo "::error::Expected one valid applicationId in app/build.gradle.kts"
            exit 1
          fi
          printf '{"project_info":{"project_number":"1234567890","project_id":"demo-receptionist-ci"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0123456789abcdef","android_client_info":{"package_name":"%s"}},"oauth_client":[{"client_id":"1234567890-demo-ci.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"offline-ci-placeholder"}]}],"configuration_version":"1"}\n' "$application_id" > app/google-services.json
      - name: Prepare registered Firebase configuration
        if: ${{ inputs.firebase_phone_build }}
        env:
          FIREBASE_CONFIG: ${{ github.ref == 'refs/heads/main' && secrets.KAI_GOOGLE_SERVICES_JSON || '' }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || -z "$FIREBASE_CONFIG" ]]; then
            echo "::error::Run from main with KAI_GOOGLE_SERVICES_JSON configured."
            exit 1
          fi
          application_id=$(sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([A-Za-z0-9_.]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          jq -e --arg package "$application_id" '
            any(.client[]; .client_info.android_client_info.package_name == $package and
              any(.api_key[]?; (.current_key // "") | startswith("AIza")))
          ' app/google-services.json >/dev/null
      - name: Build and test Android app
        run: |
          gradle --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ inputs.firebase_phone_build && 'kai-firebase-phone-apk' || 'internal-debug-apk' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
